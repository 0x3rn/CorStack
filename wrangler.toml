name = "corstack"
main = ".open-next/worker.js"
compatibility_date = "2026-09-08"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[[routes]]
pattern = "corstack.dev"
custom_domain = true

[[routes]]
pattern = "web.corstack.dev"
custom_domain = true

# Intercept the existing proxied www hostname before its old Vercel origin.
[[routes]]
pattern = "www.corstack.dev/*"
zone_name = "corstack.dev"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "corstack"

[observability.logs]
enabled = true
invocation_logs = true
[[ratelimits]]
name = "PUBLIC_API_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[vars]
ALLOWED_ORIGINS = "https://web.corstack.dev, https://corstack.dev"
SITE_URL = "https://corstack.dev"

[[r2_buckets]]
binding = "PORTFOLIO_BUCKET"
bucket_name = "corstack-media"

[images]
binding = "IMAGES"
